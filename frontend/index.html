<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenSante - Pré-diagnostic</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-blue-600 text-white py-4 shadow-lg">
        <div class="max-w-4xl mx-auto px-4">
            <h1 class="text-2xl font-bold">SenSante</h1>
            <p class="text-blue-100 text-sm">Assistant pré-diagnostic médical</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div id="form-section">
                <div class="bg-white rounded-xl shadow-md p-6">
    <h2 class="text-xl font-bold text-gray-800 mb-4">Symptômes du patient</h2>

    <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Âge</label>
        <input type="number" id="age" class="w-full border border-gray-300 rounded-lg p-2" placeholder="Ex: 28">
    </div>

    <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Sexe</label>
        <select id="sexe" class="w-full border border-gray-300 rounded-lg p-2">
            <option value="F">Féminin</option>
            <option value="M">Masculin</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Température (°C)</label>
        <input type="number" id="temperature" step="0.1" class="w-full border border-gray-300 rounded-lg p-2" placeholder="Ex: 38.5">
    </div>

    <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1">Tension systolique</label>
        <input type="number" id="tension_sys" class="w-full border border-gray-300 rounded-lg p-2" placeholder="Ex: 120">
    </div>

    <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-2">Symptômes</label>
        <div class="space-y-2">
            <label class="flex items-center">
                <input type="checkbox" id="toux" class="mr-2">
                <span>Toux</span>
            </label>
            <label class="flex items-center">
                <input type="checkbox" id="fatigue" class="mr-2">
                <span>Fatigue</span>
            </label>
            <label class="flex items-center">
                <input type="checkbox" id="maux_tete" class="mr-2">
                <span>Maux de tête</span>
            </label>
        </div>
    </div>

    <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Région</label>
        <select id="region" class="w-full border border-gray-300 rounded-lg p-2">
            <option value="Dakar">Dakar</option>
            <option value="Thies">Thiès</option>
            <option value="Saint-Louis">Saint-Louis</option>
            <option value="Ziguinchor">Ziguinchor</option>
        </select>
    </div>

    <button onclick="diagnostiquer()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">
        Diagnostiquer
    </button>
</div>
            </div>
            <div id="result-section">
    <div class="bg-white rounded-xl shadow-md p-6 text-center text-gray-400">
        <p class="text-4xl mb-3">🏥</p>
        <p class="font-medium">Remplissez le formulaire</p>
        <p class="text-sm mt-1">puis cliquez sur Diagnostiquer</p>
    </div>
    <div id="historique-container"></div>
</div>
        </div>
    </main>

    <footer class="text-center text-gray-400 text-sm py-4">
        SenSante v0.3 - ESP/UCAD - L2 GLSI 2026
    </footer>

    <script>
const API_URL = "http://localhost:8000";
let historique = []; 
async function diagnostiquer() {
    // 1. Recuperer les valeurs du formulaire
    const patient = {
        age: parseInt(document.getElementById("age").value),
        sexe: document.getElementById("sexe").value,
        temperature: parseFloat(document.getElementById("temperature").value),
        tension_sys: parseInt(document.getElementById("tension_sys").value),
        toux: document.getElementById("toux").checked,
        fatigue: document.getElementById("fatigue").checked,
        maux_tete: document.getElementById("maux_tete").checked,
        region: document.getElementById("region").value
    };
    
    // 2. Verifier les champs obligatoires
    if (!patient.age || !patient.temperature || !patient.tension_sys) {
        afficherErreur("Veuillez remplir tous les champs.");
        return;
    }
    
    // 3. Afficher le spinner de chargement
    afficherChargement();
    
    try {
        // 4. Envoyer la requete a l'API
        const response = await fetch(API_URL + "/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(patient)
        });
        
        // 5. Verifier la reponse
        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail ? JSON.stringify(err.detail) : "Erreur serveur");
        }
        
        // 6. Lire le resultat
        const resultat = await response.json();
        
        // 7. Afficher le resultat
        afficherResultat(resultat);
    } catch (error) {
        afficherErreur("Erreur de connexion : " + error.message);
    }
}
function afficherChargement() {
    const section = document.getElementById("result-section");
    section.innerHTML = `
        <div class="bg-white rounded-xl shadow-md p-6 text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-gray-500">Analyse en cours...</p>
        </div>
    `;
}
function getIcone(diagnostic) {
    const icones = {
        paludisme: "🦟",
        grippe: "🤧",
        typhoide: "🌡️",
        sain: "✅"
    };
    return icones[diagnostic] || "🏥";
}
//Exercice 2 - Historique des diagnostics
function ajouterHistorique(diagnostic, probabilite) {
    const now = new Date();
    const dateHeure = now.toLocaleString('fr-FR');
    
    historique.unshift({  // Ajoute au début du tableau
        diagnostic: diagnostic,
        probabilite: (probabilite * 100).toFixed(1) + "%",
        date: dateHeure
    });
    
    if (historique.length > 5) {
        historique.pop();
    }
    
    afficherHistorique();
}
function afficherHistorique() {
    let historiqueHtml = `
        <div class="mt-6 bg-white rounded-xl shadow-md p-4">
            <h3 class="text-lg font-bold text-gray-800 mb-3">📋 Historique (5 dernières consultations)</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="p-2 text-left">Diagnostic</th>
                            <th class="p-2 text-left">Probabilité</th>
                            <th class="p-2 text-left">Date/Heure</th>
                        </tr>
                    </thead>
                    <tbody>
    `;
    
    if (historique.length === 0) {
        historiqueHtml += `
            <tr>
                <td colspan="3" class="p-2 text-center text-gray-400">Aucune consultation</td>
            </tr>
        `;
    } else {
        for (let item of historique) {
            // Code couleur pour le diagnostic dans l'historique
            let couleurClasse = "text-gray-800";
            if (item.diagnostic === "palu") couleurClasse = "text-red-600 font-bold";
            else if (item.diagnostic === "grippe") couleurClasse = "text-orange-600 font-bold";
            else if (item.diagnostic === "typh") couleurClasse = "text-yellow-600 font-bold";
            else if (item.diagnostic === "sain") couleurClasse = "text-green-600 font-bold";
            
            historiqueHtml += `
                <tr class="border-b border-gray-100">
                    <td class="p-2 ${couleurClasse}">${getIcone(item.diagnostic)} ${item.diagnostic}</td>
                    <td class="p-2">${item.probabilite}</td>
                    <td class="p-2 text-gray-500 text-xs">${item.date}</td>
                </tr>
            `;
        }
    }
    
    historiqueHtml += `
                    </tbody>
                </table>
            </div>
        </div>
    `;
    
    // Ajouter l'historique à la fin de la section résultat
    const section = document.getElementById("result-section");
    // On ne remplace pas, on ajoute après le résultat actuel
    const existingResult = section.innerHTML;
    if (!existingResult.includes("historique-container")) {
        // Créer un conteneur pour l'historique s'il n'existe pas
        const historiqueContainer = document.getElementById("historique-container");
        if (historiqueContainer) {
            historiqueContainer.innerHTML = historiqueHtml;
        } else {
            // Créer le conteneur
            const newContainer = document.createElement("div");
            newContainer.id = "historique-container";
            newContainer.innerHTML = historiqueHtml;
            section.appendChild(newContainer);
        }
    } else {
        const historiqueContainer = document.getElementById("historique-container");
        if (historiqueContainer) historiqueContainer.innerHTML = historiqueHtml;
    }
}
function afficherResultat(r) {
    // Codes couleur par diagnostic
    const couleurs = {
        paludisme: {bg:"bg-red-100", text:"text-red-800", bar:"bg-red-500", badge:"bg-red-500"},
        grippe: {bg:"bg-orange-100", text:"text-orange-800", bar:"bg-orange-500", badge:"bg-orange-500"},
        typhoide: {bg:"bg-yellow-100", text:"text-yellow-800", bar:"bg-yellow-500", badge:"bg-yellow-500"},
        sain: {bg:"bg-green-100", text:"text-green-800", bar:"bg-green-500", badge:"bg-green-500"}
    };
    const c = couleurs[r.diagnostic] || couleurs["sain"];
    const pct = Math.round(r.probabilite * 100);
    const section = document.getElementById("result-section");
    
    section.innerHTML = `
        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Resultat</h2>
            <div class="${c.bg} rounded-lg p-4 mb-4">
                <p class="text-sm text-gray-600">Diagnostic :</p>
                <p class="text-2xl font-bold ${c.text} uppercase mt-1 flex items-center gap-2">
                    ${getIcone(r.diagnostic)} 
                    ${r.diagnostic}
                </p>
            </div>
            <div class="mb-4">
                <div class="flex justify-between mb-1">
                    <span class="text-sm text-gray-600">Probabilite</span>
                    <span class="text-sm font-bold ${c.text}">${pct}%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div class="${c.bar} h-3 rounded-full transition-all duration-500"
                        style="width: ${pct}%"></div>
                </div>
            </div>
            <div class="flex items-center gap-2 mb-3">
                <span class="${c.badge} text-white text-xs px-2 py-1 rounded-full">
                    ${r.confiance}
                </span>
                <span class="text-sm text-gray-600">confiance</span>
            </div>
            <div class="bg-gray-50 rounded-lg p-3">
                <p class="text-sm text-gray-700">${r.message}</p>
            </div>
        </div>
    `;
// Ajouter à l'historique
ajouterHistorique(r.diagnostic, r.probabilite);
}

function afficherErreur(msg) {
    const section = document.getElementById("result-section");
    section.innerHTML = `
        <div class="bg-red-50 border border-red-200 rounded-xl p-6">
            <p class="text-red-700 font-medium">${msg}</p>
            <p class="text-red-500 text-sm mt-2">
                Verifiez votre connexion et reessayez.
            </p>
        </div>
    `;
}


    </script>

</body>
</html>
